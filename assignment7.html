<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Specifications</title>
</head>
<body>
    <h1>Smartphone Product Details</h1>

    <table border="1" cellpadding="10">
        <caption>Product Specification Table</caption>

        <thead>
            <tr>
                <th>Specification</th>
                <th>Details</th>
            </tr>
        </thead>

        <tbody>
            <tr>
                <td>Product Name</td>
                <td>Redmi 12 5g</td>
            </tr>
            <tr>
                <td>Brand</td>
                <td>Xiaomi</td>
            </tr>
            <tr>
                <td>Display</td>
                <td>6.5-inch HD Display</td>
            </tr>
            <tr>
                <td>RAM</td>
                <td>8 GB</td>
            </tr>
            <tr>
                <td>Storage</td>
                <td>128 GB</td>
            </tr>
            <tr>
                <td>Battery</td>
                <td>5000 mAh</td>
            </tr>
            <tr>
                <td>Operating System</td>
                <td>Android</td>
            </tr>
            <tr>
                <td>Price</td>
                <td>₹15,999</td>
            </tr>
        </tbody>
    </table>

    <p>
        <button type="button">Buy Now</button>
    </p>
</body>
</html>
